{# Reusable Card Skeleton Component (Services, Products, Courses) #}
<div class="animate-pulse bg-white rounded-3xl border border-slate-100 p-5 space-y-4 shadow-sm">
    <!-- Image Placeholder -->
    <div class="w-full h-48 bg-slate-200 rounded-2xl"></div>
    <!-- Category & Badge Placeholder -->
    <div class="flex items-center justify-between">
        <div class="h-4 w-20 bg-slate-200 rounded-md"></div>
        <div class="h-4 w-12 bg-slate-200 rounded-full"></div>
    </div>
    <!-- Title Placeholder -->
    <div class="h-6 w-3/4 bg-slate-200 rounded-lg"></div>
    <!-- Text Lines Placeholder -->
    <div class="space-y-2">
        <div class="h-3 w-full bg-slate-100 rounded"></div>
        <div class="h-3 w-5/6 bg-slate-100 rounded"></div>
    </div>
    <!-- Footer CTA Placeholder -->
    <div class="pt-2 flex items-center justify-between border-t border-slate-50">
        <div class="h-6 w-24 bg-slate-200 rounded-lg"></div>
        <div class="h-9 w-28 bg-slate-200 rounded-xl"></div>
    </div>
</div>

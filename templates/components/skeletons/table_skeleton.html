{# Reusable Data Table Skeleton Component #}
<div class="animate-pulse bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
    <div class="p-4 bg-slate-50 border-b border-slate-200 flex items-center justify-between">
        <div class="h-4 w-32 bg-slate-200 rounded"></div>
        <div class="h-8 w-24 bg-slate-200 rounded-lg"></div>
    </div>
    <div class="divide-y divide-slate-100">
        {% for i in "12345" %}
        <div class="p-4 flex items-center justify-between space-x-4">
            <div class="flex items-center space-x-3 w-1/3">
                <div class="w-8 h-8 rounded-full bg-slate-200 shrink-0"></div>
                <div class="space-y-1.5 w-full">
                    <div class="h-3.5 w-3/4 bg-slate-200 rounded"></div>
                    <div class="h-2.5 w-1/2 bg-slate-100 rounded"></div>
                </div>
            </div>
            <div class="h-4 w-20 bg-slate-200 rounded hidden sm:block"></div>
            <div class="h-4 w-16 bg-slate-200 rounded"></div>
            <div class="h-6 w-20 bg-slate-200 rounded-full"></div>
            <div class="h-8 w-16 bg-slate-200 rounded-lg"></div>
        </div>
        {% endfor %}
    </div>
</div>
